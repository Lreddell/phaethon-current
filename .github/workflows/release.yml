name: PR 8 native Mac preview delivery
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Native Mac architecture
        required: true
        default: arm64
        type: choice
        options: [arm64, x64]
permissions:
  contents: write
jobs:
  mac:
    name: Native Mac ${{ inputs.arch }}
    if: github.repository == 'Lreddell/phaethon-current'
    timeout-minutes: 35
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    env:
      SOURCE_SHA: 851d52a282636efcf93d09503c159129a72c8753
      BUILD_ARCH: ${{ inputs.arch }}
      EXPECTED_MACHINE: ${{ inputs.arch == 'arm64' && 'arm64' || 'x86_64' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 851d52a282636efcf93d09503c159129a72c8753
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Confirm exact source and native architecture
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          sw_vers
          uname -m
      - run: pnpm install --frozen-lockfile
      - name: Confirm the native macOS 26 Xcode toolchain
        shell: bash
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun actool --version
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium-headless-shell
      - run: pnpm exec playwright test
      - name: Start real old and current Codex app servers without an account
        shell: bash
        run: |
          for version in 0.128.0 0.169.0; do
            npm install --prefix "$RUNNER_TEMP/pr8-codex-$version" --no-audit --no-fund "@openai/codex@$version"
          done
          cat > "$RUNNER_TEMP/pr8-cli-probe.mts" <<'TS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawn} from 'node:child_process';
          import {createInterface} from 'node:readline';
          import {pathToFileURL} from 'node:url';
          const {appServerArgs,CLIENT_INFO}=await import(pathToFileURL(path.join(process.cwd(),'src/server/cli/codex.ts')).href);
          const results=[];
          for(const version of ['0.128.0','0.169.0']) {
            const configDir=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP!,'pr8-empty-codex-'));
            const binary=path.join(process.env.RUNNER_TEMP!,`pr8-codex-${version}`,'node_modules/.bin/codex');
            const args=appServerArgs([configDir,process.cwd()]);
            if(args.includes('features.prefer_mxc=true')) throw new Error('Windows-only MXC option reached macOS');
            const child=spawn(binary,args,{env:{...process.env,CODEX_HOME:configDir},stdio:['pipe','pipe','pipe']});
            let stderr=''; child.stderr.on('data',data=>stderr+=String(data));
            const lines=createInterface({input:child.stdout});
            try {
              const result=await new Promise((resolve,reject)=>{
                const timeout=setTimeout(()=>reject(new Error('CLI initialize timed out: '+stderr.slice(-1500))),20000);
                child.once('error',error=>{clearTimeout(timeout);reject(error)});
                child.once('exit',code=>{clearTimeout(timeout);reject(new Error(`CLI exited ${code}: ${stderr.slice(-1500)}`))});
                lines.on('line',line=>{try{const message=JSON.parse(line);if(message.id===1){clearTimeout(timeout);message.error?reject(new Error(JSON.stringify(message.error))):resolve(message.result)}}catch{}});
                child.stdin.write(JSON.stringify({id:1,method:'initialize',params:{clientInfo:CLIENT_INFO,capabilities:{experimentalApi:true}}})+'\n');
              });
              results.push({version,platform:process.platform,architecture:process.arch,initialized:true,result});
            } finally {lines.close();child.stdin.end();child.kill('SIGTERM')}
          }
          fs.writeFileSync(`release-cli-probe-${process.arch}.json`,JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          TS
          pnpm exec tsx "$RUNNER_TEMP/pr8-cli-probe.mts"
      - name: Package native DMG and ZIP with upstream ad-hoc signing fallback
        shell: bash
        run: |
          mkdir -p delivery
          pnpm exec electron-builder --mac "--$BUILD_ARCH" --publish never \
            -c.mac.identity=- -c.mac.hardenedRuntime=false \
            '-c.artifactName=Phaethon-${version}-PR8-851d52a-${os}-${arch}.${ext}' \
            2>&1 | tee "delivery/mac-$BUILD_ARCH-package.log"
      - name: Verify app signature, native modules, source bytes and DMG startup
        shell: bash
        run: |
          mkdir -p delivery
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {createRequire} from 'node:module';
          import {execFileSync,spawnSync} from 'node:child_process';
          const req=createRequire(import.meta.url);
          const br=createRequire(req.resolve('electron-builder'));
          const ar=createRequire(br.resolve('app-builder-lib'));
          const asar=ar('@electron/asar');
          const arch=process.env.BUILD_ARCH;
          const expected=arch==='arm64'?'arm64':'x86_64';
          const app=path.resolve('release',arch==='arm64'?'mac-arm64':'mac','Phaethon.app');
          execFileSync('codesign',['--verify','--deep','--strict',app],{stdio:'inherit'});
          const binary=path.join(app,'Contents/MacOS/Phaethon');
          const binaryArch=execFileSync('lipo',['-archs',binary],{encoding:'utf8'}).trim();
          if(binaryArch!==expected)throw new Error('Wrong application architecture: '+binaryArch);
          const archive=path.join(app,'Contents/Resources/app.asar');
          const packageInfo=JSON.parse(asar.extractFile(archive,'package.json'));
          if(packageInfo.version!=='0.3.1')throw new Error('Wrong application version');
          const entries=['dist/server/main.mjs','dist/server/text-child.mjs','dist/desktop/main.cjs','dist/desktop/preload.cjs','dist/web/index.html'];
          for(const entry of entries)if(!fs.readFileSync(entry).equals(asar.extractFile(archive,entry)))throw new Error('Packaged bytes differ: '+entry);
          const natives=fs.readdirSync(path.join(app,'Contents/Resources'),{recursive:true}).filter(name=>name.endsWith('.node'));
          if(!natives.some(name=>name.includes('keyring'))||!natives.some(name=>name.includes('canvas')))throw new Error('Required native module missing');
          for(const native of natives){const architectures=execFileSync('lipo',['-archs',path.join(app,'Contents/Resources',native)],{encoding:'utf8'}).trim();if(!architectures.split(/\s+/).includes(expected))throw new Error('Wrong native module architecture: '+native)}
          const dmg=path.resolve('release',`Phaethon-0.3.1-PR8-851d52a-mac-${arch}.dmg`);
          const mount=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'pr8-mount-'));
          const screenshot=path.resolve('delivery',`mac-${arch}-startup.png`);
          const config=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'pr8-mac-smoke-'));
          let mounted=false;
          try {
            execFileSync('hdiutil',['attach',dmg,'-mountpoint',mount,'-nobrowse','-readonly'],{stdio:'inherit'});mounted=true;
            const installedApp=path.join(mount,'Phaethon.app');
            execFileSync('codesign',['--verify','--deep','--strict',installedApp],{stdio:'inherit'});
            const launched=spawnSync(path.join(installedApp,'Contents/MacOS/Phaethon'),[],{env:{...process.env,PHAETHON_HOME:config,PHAETHON_CAPTURE:screenshot,PHAETHON_CAPTURE_PROFILE:path.join(config,'browser'),PHAETHON_CAPTURE_DELAY:'5000',PHAETHON_CAPTURE_SKIP_SETUP:'1',PHAETHON_CAPTURE_SIZE:'1280x800'},encoding:'utf8',timeout:90000});
            fs.writeFileSync(path.resolve('delivery',`mac-${arch}-startup.log`),String(launched.stdout??'')+String(launched.stderr??''));
            if(launched.status!==0||!fs.existsSync(screenshot))throw new Error('DMG application startup failed: '+String(launched.stderr).slice(-2500));
            const png=fs.readFileSync(screenshot);if(!png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))||png.readUInt32BE(16)<1280||png.readUInt32BE(20)<800)throw new Error('Bad startup capture');
          }finally{if(mounted)execFileSync('hdiutil',['detach',mount],{stdio:'inherit'})}
          const minimumOS=execFileSync('/usr/libexec/PlistBuddy',['-c','Print :LSMinimumSystemVersion',path.join(app,'Contents/Info.plist')],{encoding:'utf8'}).trim();
          const receipt={source:process.env.SOURCE_SHA,platform:process.platform,architecture:arch,runnerOS:execFileSync('sw_vers',['-productVersion'],{encoding:'utf8'}).trim(),minimumOS,version:packageInfo.version,adHocSigned:true,notarized:false,signatureVerified:true,nativeModuleCount:natives.length,entryFilesVerified:entries.length,dmgMountedAndLaunched:true,startupScreenshot:path.basename(screenshot),archiveSHA256:crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex'),assets:[]};
          for(const ext of ['dmg','zip']){const name=`Phaethon-0.3.1-PR8-851d52a-mac-${arch}.${ext}`;const file=path.join('release',name);const bytes=fs.readFileSync(file);receipt.assets.push({name,size:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});fs.copyFileSync(file,path.join('delivery',name))}
          fs.copyFileSync(`release-cli-probe-${arch}.json`,path.join('delivery',`mac-${arch}-cli-startup.json`));
          fs.writeFileSync(path.join('delivery',`mac-${arch}-validation.json`),JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          JS
      - name: Upload verified Mac downloads to the existing unpublished preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,hashlib
          from urllib.parse import quote
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];arch=os.environ['BUILD_ARCH']
          api=f'https://api.github.com/repos/{repo}';release_id=450544895
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'Phaethon-PR8-Mac-delivery'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:return json.load(response)
          release=get(f'{api}/releases/{release_id}')
          if not release['draft'] or release['target_commitish']!=os.environ['SOURCE_SHA']:raise RuntimeError('Unexpected preview release')
          upload=release['upload_url'].split('{')[0]
          existing={asset['name']:asset for asset in get(f'{api}/releases/{release_id}/assets')}
          files=list(pathlib.Path('delivery').glob(f'*mac-{arch}.*'))+list(pathlib.Path('delivery').glob(f'mac-{arch}-*.json'))+list(pathlib.Path('delivery').glob(f'mac-{arch}-*.png'))
          for file in files:
              data=file.read_bytes();digest='sha256:'+hashlib.sha256(data).hexdigest()
              if file.name in existing:
                  asset=existing[file.name]
                  if asset.get('digest')!=digest:raise RuntimeError('Different existing asset: '+file.name)
              else:
                  request=urllib.request.Request(upload+'?name='+quote(file.name),data=data,headers={**headers,'Content-Type':'application/octet-stream'},method='POST')
                  with urllib.request.urlopen(request,timeout=600) as response:asset=json.load(response)
              if asset['size']!=len(data) or asset.get('digest')!=digest:raise RuntimeError('Asset verification failed: '+file.name)
              print(json.dumps({'name':asset['name'],'size':asset['size'],'sha256':digest,'url':asset['browser_download_url']}))
          if not get(f'{api}/releases/{release_id}')['draft']:raise RuntimeError('Preview was unexpectedly published')
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pr8-mac-${{ inputs.arch }}-851d52a
          path: |
            delivery/
            test-results/
          compression-level: 0
          retention-days: 7
