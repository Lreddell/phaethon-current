name: personal release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: personal-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: '["windows-latest"]'
    permissions:
      contents: read
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release version
        id: version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the Windows release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "Phaethon $VERSION - Windows personal build" --target "$GITHUB_SHA" --notes-file docs/personal-release-notes.md
          fi
  build:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package and upload the Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --x64 --publish always
  publish:
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Windows downloads and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          gh release download "v$VERSION" --dir "$assets"
          cd "$assets"
          for asset in "Phaethon-$VERSION-win-x64.exe" "Phaethon-$VERSION-win-x64.exe.blockmap" latest.yml; do
            test -s "$asset" || { echo "Missing or empty asset: $asset" >&2; exit 1; }
          done
          sha256sum "Phaethon-$VERSION-win-x64.exe" "Phaethon-$VERSION-win-x64.exe.blockmap" latest.yml > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release upload "v$VERSION" SHA256SUMS.txt --clobber
          gh release edit "v$VERSION" --draft=false --prerelease=false --latest
